services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: quality-api:1.0
    container_name: quality-api
    ports:
      - "8080:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
